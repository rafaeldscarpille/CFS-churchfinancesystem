<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Gestão Financeira — Igreja</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body,#root{height:100%}
body{font-family:'Segoe UI',system-ui,sans-serif;transition:background .2s,color .2s}
input,select,button,textarea{font-family:inherit}
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{border-radius:3px}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes toastIn{from{opacity:0;transform:translateX(50px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
.page{animation:fadeIn .2s ease}
.toast{animation:toastIn .3s ease}
table{border-collapse:collapse;width:100%}
th,td{text-align:left}

/* LIGHT */
body.light{
  --bg:#f1f5f9;--card:#fff;--card2:#f8fafc;--card3:#f1f5f9;
  --sidebar:#0f172a;--sidebar-hover:#1e40af;
  --inp:#fff;--border:#e2e8f0;--border-inp:#e5e7eb;
  --t1:#0f172a;--t2:#374151;--t3:#64748b;--t4:#94a3b8;
  --shadow:0 1px 4px rgba(0,0,0,.06);--sc:#cbd5e1;
}
/* DARK */
body.dark{
  --bg:#0b1120;--card:#131d30;--card2:#1a2540;--card3:#0f172a;
  --sidebar:#070e1a;--sidebar-hover:#1e3a8a;
  --inp:#1a2540;--border:#1e3050;--border-inp:#253450;
  --t1:#e2e8f0;--t2:#cbd5e1;--t3:#64748b;--t4:#475569;
  --shadow:0 1px 4px rgba(0,0,0,.3);--sc:#1e3050;
}
body{background:var(--bg);color:var(--t1)}
::-webkit-scrollbar-thumb{background:var(--sc)}

/* LAYOUT */
.layout{display:flex;height:100vh;overflow:hidden}
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:198}
.sidebar-overlay.on{display:block}
.sidebar-wrap{position:relative;z-index:199;flex-shrink:0;transition:width .25s}
.sidebar-inner{width:100%;height:100%;background:var(--sidebar);display:flex;flex-direction:column;border-right:1px solid #1e293b;overflow:hidden}
.main{flex:1;overflow:auto;background:var(--bg);min-width:0}
.topbar{display:none;align-items:center;gap:12px;padding:10px 16px;background:var(--sidebar);border-bottom:1px solid #1e293b;position:sticky;top:0;z-index:100}

/* DESKTOP COLLAPSED */
@media(min-width:769px){
  .sidebar-wrap.open{width:224px}
  .sidebar-wrap.closed{width:60px}
  .sidebar-wrap.closed .lbl{display:none}
  .sidebar-wrap.closed .hdr-text{display:none}
  .sidebar-wrap.closed .ftr-text{display:none}
  .sidebar-wrap.closed .fb-txt{display:none}
  .sidebar-wrap.closed .tgl-lbl{display:none}
  .sidebar-wrap.closed .nav-btn{justify-content:center;padding:10px 0}
  .sidebar-wrap.closed .nav-ico{font-size:20px}
  .topbar{display:none!important}
}

/* MOBILE */
@media(max-width:768px){
  .sidebar-wrap{position:fixed;top:0;left:0;height:100vh;width:0;overflow:hidden}
  .sidebar-wrap.open{width:240px}
  .sidebar-wrap.closed{width:0}
  .topbar{display:flex!important}
  .kgrid{grid-template-columns:1fr 1fr!important}
  .cgrid{grid-template-columns:1fr!important}
  .bgrid{grid-template-columns:1fr!important}
  .frow{flex-wrap:wrap!important}
  .fg2{grid-template-columns:1fr!important}
}
@media(max-width:480px){
  .kgrid{grid-template-columns:1fr!important}
}
</style>
</head>
<body>
<script>
(function(){var t=localStorage.getItem("theme");document.body.className=t==="light"?"light":"dark"})();
</script>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef,useCallback}=React;

// ─── Firebase config ─────────────────────────────────────────────
const FB_CFG={
  apiKey:"AIzaSyDzid4R1lFjWaYBGMAJIGb2aDHAzP5acxE",
  authDomain:"churchfinancesystem.firebaseapp.com",
  projectId:"churchfinancesystem",
  storageBucket:"churchfinancesystem.firebasestorage.app",
  messagingSenderId:"676835789806",
  appId:"1:676835789806:web:63b6c6aa5b4a2f91fc5cff"
};

let _db=null;

async function initFB(){
  try{
    if(firebase.apps.length) await firebase.app().delete().catch(()=>{});
    firebase.initializeApp(FB_CFG);
    _db=firebase.firestore();
    await _db.collection("_ping").doc("t").set({ts:new Date().toISOString()},{merge:true});
    return true;
  }catch(e){_db=null;console.warn("Firebase init failed:",e.message);return false;}
}

const COL={users:"usuarios",income:"entradas",expenses:"custos",logs:"logs"};

async function fbSet(col,id,data){if(!_db)return;try{await _db.collection(col).doc(id).set(data,{merge:true})}catch(e){console.error(e)}}
async function fbDel(col,id){if(!_db)return;try{await _db.collection(col).doc(id).delete()}catch(e){console.error(e)}}
async function fbLog(e){if(!_db)return;try{await _db.collection(COL.logs).doc(e.id).set(e)}catch(e2){console.error(e2)}}

function fbListen(col,field,cb){
  if(!_db)return()=>{};
  let q=_db.collection(col);
  if(field)q=q.orderBy(field,"desc");
  return q.onSnapshot(s=>cb(s.docs.map(d=>({id:d.id,...d.data()}))),e=>console.error(e));
}

// ─── Local fallback ───────────────────────────────────────────────
const ADMIN0={id:"admin",name:"admin",email:"admin",username:"admin",password:"rootadmin",role:"master",active:true,perms:{},createdAt:new Date().toISOString()};
const INIT={users:[ADMIN0],income:[],expenses:[],logs:[]};

function loadLocal(){
  try{const s=localStorage.getItem("igreja_v5");if(!s)return INIT;const p=JSON.parse(s);if(!p.logs)p.logs=[];if(p.income)p.income=p.income.map(i=>({...i,status:i.status||"aprovado"}));return p;}
  catch{return INIT;}
}
function saveLocal(d){try{localStorage.setItem("igreja_v5",JSON.stringify(d))}catch{}}

// ─── Helpers ──────────────────────────────────────────────────────
const fmt=v=>new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"}).format(v);
const fmtD=d=>{try{return new Date(d+"T12:00:00").toLocaleDateString("pt-BR")}catch{return d}};
const fmtDT=t=>{try{return new Date(t).toLocaleString("pt-BR")}catch{return t}};
const uid=()=>Math.random().toString(36).slice(2,10);
const now=()=>new Date().toISOString();
const MO=["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
const ET={fixo:"Custo Fixo",variavel:"Custo Variável",imprevisto:"Imprevisto"};
const EC={fixo:"#0d9488",variavel:"#7c3aed",imprevisto:"#dc2626"};
const EB={fixo:"#ecfdf5",variavel:"#f5f3ff",imprevisto:"#fef2f2"};
const IL={dizimo:"Dízimo",oferta:"Oferta"};
const CATS=["Conta de Luz","Água","Salário Pastor","Manutenção","Equipamentos","Doações Beneficentes","Imprevisto","Aluguel","Internet","Material de Limpeza","Outros"];
const RL={master:"Admin Master",gestor:"Gestor",editor:"Editor",auditor:"Auditor",agente:"Agente"};
const RC={master:"#7c3aed",gestor:"#0f766e",editor:"#0d9488",auditor:"#d97706",agente:"#2563eb"};
const RD={
  master:"Acesso total, incluindo criação de usuários.",
  gestor:"Todas as operações financeiras + aprovar entradas. Não cria usuários.",
  editor:"Cria/edita conforme permissões definidas pelo admin.",
  auditor:"Somente leitura de dados e logs.",
  agente:"Insere entradas que aguardam aprovação do Gestor."
};
const can=(u,a)=>{if(u.role==="master"||u.role==="gestor")return true;if(u.role==="agente"&&a==="createIncome")return true;if(u.role==="editor")return !!u.perms?.[a];return false;};

// ─── Shared UI ────────────────────────────────────────────────────
const IS={width:"100%",padding:"10px 12px",border:"1.5px solid var(--border-inp)",borderRadius:9,fontSize:13,outline:"none",boxSizing:"border-box",background:"var(--inp)",color:"var(--t1)"};

function Spinner({size=24,color="#6366f1"}){return <div style={{width:size,height:size,border:`3px solid var(--border)`,borderTopColor:color,borderRadius:"50%",animation:"spin .7s linear infinite",flexShrink:0}}/>;}
function Toast({msg,type,onClose}){
  const bg={success:"#059669",error:"#dc2626",info:"#2563eb",warning:"#d97706"}[type]||"#059669";
  useEffect(()=>{const t=setTimeout(onClose,4000);return()=>clearTimeout(t)},[]);
  return <div className="toast" style={{position:"fixed",top:20,right:20,zIndex:9999,background:bg,color:"#fff",padding:"12px 18px",borderRadius:10,fontSize:14,fontWeight:600,boxShadow:"0 8px 24px rgba(0,0,0,.22)",display:"flex",alignItems:"center",gap:10,maxWidth:380}}><span style={{flex:1}}>{msg}</span><button onClick={onClose} style={{background:"none",border:"none",color:"#fff",cursor:"pointer",fontSize:18,lineHeight:1}}>×</button></div>;
}
function Confirm({msg,onY,onN}){
  return <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.45)",zIndex:9000,display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
    <div style={{background:"var(--card)",borderRadius:14,padding:"24px 20px",maxWidth:340,width:"100%",textAlign:"center",boxShadow:"0 20px 60px rgba(0,0,0,.3)"}}>
      <div style={{fontSize:36,marginBottom:12}}>⚠️</div>
      <p style={{fontSize:14,color:"var(--t2)",marginBottom:24,lineHeight:1.6}}>{msg}</p>
      <div style={{display:"flex",gap:10,justifyContent:"center"}}>
        <button onClick={onN} style={{padding:"9px 20px",border:"1.5px solid var(--border-inp)",borderRadius:8,background:"var(--card)",color:"var(--t2)",fontSize:13,cursor:"pointer",fontWeight:600}}>Cancelar</button>
        <button onClick={onY} style={{padding:"9px 20px",border:"none",borderRadius:8,background:"#dc2626",color:"#fff",fontSize:13,cursor:"pointer",fontWeight:600}}>Confirmar</button>
      </div>
    </div>
  </div>;
}
function PH({title,sub,children}){return <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:24,flexWrap:"wrap",gap:12}}><div><h1 style={{fontSize:22,fontWeight:800,color:"var(--t1)",margin:0}}>{title}</h1>{sub&&<p style={{fontSize:13,color:"var(--t3)",marginTop:4}}>{sub}</p>}</div>{children}</div>;}
function Fld({label,children,span}){return <div style={{gridColumn:span?"1/-1":undefined}}><label style={{fontSize:12,fontWeight:700,color:"var(--t2)",display:"block",marginBottom:6}}>{label}</label>{children}</div>;}
function Pill({c,bg,children}){return <span style={{padding:"4px 10px",borderRadius:8,background:bg,color:c,fontSize:11,fontWeight:700,border:`1px solid ${c}30`,whiteSpace:"nowrap"}}>{children}</span>;}
function Btn({color,onClick,children,disabled}){return <button onClick={onClick} disabled={disabled} style={{padding:"10px 18px",background:disabled?"#94a3b8":color,color:"#fff",border:"none",borderRadius:10,fontSize:13,fontWeight:700,cursor:disabled?"not-allowed":"pointer"}}>{children}</button>;}
function SBtn({c,bg,bd,onClick,children}){return <button onClick={onClick} style={{padding:"5px 11px",background:bg,border:`1px solid ${bd}`,borderRadius:7,color:c,fontSize:11,fontWeight:700,cursor:"pointer"}}>{children}</button>;}
function FC({title,onClose,children}){return <div style={{background:"var(--card)",borderRadius:14,padding:24,border:"1px solid var(--border)",marginBottom:20,boxShadow:"var(--shadow)",animation:"fadeIn .2s ease"}}><div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}><h3 style={{fontSize:15,fontWeight:800,color:"var(--t1)"}}>{title}</h3><button onClick={onClose} style={{background:"none",border:"none",fontSize:20,color:"var(--t4)",cursor:"pointer",lineHeight:1}}>×</button></div>{children}</div>;}
function FA({onSave,onCancel,color="#059669",label="Salvar",loading}){return <div style={{display:"flex",gap:10,marginTop:20,alignItems:"center"}}><button onClick={onSave} disabled={loading} style={{padding:"10px 24px",background:loading?"#94a3b8":color,color:"#fff",border:"none",borderRadius:9,fontSize:13,fontWeight:700,cursor:loading?"not-allowed":"pointer",display:"flex",alignItems:"center",gap:8}}>{loading&&<Spinner size={16} color="#fff"/>}{loading?"Salvando...":label}</button><button onClick={onCancel} style={{padding:"10px 20px",background:"var(--card2)",color:"var(--t3)",border:"1px solid var(--border)",borderRadius:9,fontSize:13,fontWeight:600,cursor:"pointer"}}>Cancelar</button></div>;}

// ─── APP ──────────────────────────────────────────────────────────
function App(){
  const [fbOk,setFbOk]=useState(null); // null=loading, true=firebase, false=local
  const [db,setDb]=useState(null);
  const [user,setUser]=useState(null);
  const [page,setPage]=useState("dashboard");
  const [toasts,setToasts]=useState([]);
  const [confirm,setConfirm]=useState(null);
  const [syncing,setSyncing]=useState(false);
  const [dark,setDark]=useState(()=>localStorage.getItem("theme")!=="light");
  const [sideOpen,setSideOpen]=useState(true);
  const [isMob,setIsMob]=useState(false);

  // Theme
  useEffect(()=>{
    document.body.classList.remove("light","dark");
    document.body.classList.add(dark?"dark":"light");
    localStorage.setItem("theme",dark?"dark":"light");
  },[dark]);

  // Responsive
  useEffect(()=>{
    const check=()=>{const m=window.innerWidth<=768;setIsMob(m);setSideOpen(!m);};
    check();
    window.addEventListener("resize",check);
    return()=>window.removeEventListener("resize",check);
  },[]);

  // Firebase init with 8s timeout
  useEffect(()=>{
    let dead=false;
    const t=setTimeout(()=>{if(!dead&&fbOk===null){setFbOk(false);}},8000);
    initFB().then(ok=>{if(!dead){clearTimeout(t);setFbOk(ok);}});
    return()=>{dead=true;clearTimeout(t)};
  },[]);

  // Data subscriptions
  useEffect(()=>{
    if(fbOk===null)return;
    if(fbOk===false){setDb(loadLocal());return;}

    const s={users:[],income:[],expenses:[],logs:[]};
    const f={users:false,income:false,expenses:false,logs:false};
    const trySet=()=>{if(f.users&&f.income&&f.expenses&&f.logs)setDb({...s});};

    const u0=fbListen(COL.users,"createdAt",d=>{s.users=d.length?d:[ADMIN0];f.users=true;trySet();});
    const u1=fbListen(COL.income,"createdAt",d=>{s.income=d;f.income=true;trySet();});
    const u2=fbListen(COL.expenses,"createdAt",d=>{s.expenses=d;f.expenses=true;trySet();});
    const u3=fbListen(COL.logs,"timestamp",d=>{s.logs=d;f.logs=true;trySet();});

    // Safety: after 6s force db with whatever we have
    const safe=setTimeout(()=>setDb(p=>p||{users:s.users.length?s.users:[ADMIN0],income:s.income,expenses:s.expenses,logs:s.logs}),6000);

    // Bootstrap admin if empty
    setTimeout(async()=>{try{const snap=await _db.collection(COL.users).get();if(snap.empty)await fbSet(COL.users,ADMIN0.id,ADMIN0);}catch{}},3000);

    return()=>{u0();u1();u2();u3();clearTimeout(safe);};
  },[fbOk]);

  const toast=useCallback((msg,type="success")=>{const id=uid();setToasts(t=>[...t,{id,msg,type}]);},[]);
  const rmToast=id=>setToasts(t=>t.filter(x=>x.id!==id));
  const confirm2=msg=>new Promise(res=>setConfirm({msg,res}));
  const doConfirm=v=>{confirm?.res(v);setConfirm(null);};

  const updateDb=useCallback(async(next,ops=[])=>{
    if(fbOk&&ops.length){
      setSyncing(true);
      await Promise.all(ops.map(op=>op.t==="set"?fbSet(op.col,op.id,op.d):op.t==="del"?fbDel(op.col,op.id):op.t==="log"?fbLog(op.d):null));
      setSyncing(false);
    }else{setDb(next);saveLocal(next);}
  },[fbOk]);

  const addLog=useCallback((action,details,tid=null)=>{
    if(!user)return;
    const e={id:"l"+uid(),timestamp:now(),userId:user.id,userName:user.name,userRole:user.role,action,details,targetId:tid,createdAt:now()};
    if(fbOk)fbLog(e);
    else setDb(p=>{const n={...p,logs:[e,...(p.logs||[])].slice(0,1000)};saveLocal(n);return n;});
  },[fbOk,user]);

  const login=u=>{setUser(u);setPage("dashboard");};
  const logout=()=>{setUser(null);setPage("dashboard");};
  const toggleTheme=()=>setDark(d=>!d);
  const toggleSide=()=>setSideOpen(s=>!s);
  const closeSide=()=>{if(isMob)setSideOpen(false);};

  // Loading screen
  if(fbOk===null||!db){
    return <div style={{height:"100vh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:16,background:"var(--bg)"}}>
      <div style={{width:60,height:60,background:"linear-gradient(135deg,#1d4ed8,#7c3aed)",borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",fontSize:26}}>✝</div>
      <Spinner size={36}/>
      <p style={{fontSize:14,color:"var(--t3)",textAlign:"center",padding:"0 20px"}}>{fbOk===null?"Conectando ao Firebase...":"Carregando dados..."}</p>
      {fbOk===null&&<p style={{fontSize:11,color:"var(--t4)"}}>Aguarde até 8 segundos…</p>}
    </div>;
  }

  if(!user) return <Login db={db} onLogin={login} toast={toast}/>;

  const canLog=["master","auditor","gestor"].includes(user.role);
  const canUsers=user.role==="master";

  return <>
    {toasts.map(t=><Toast key={t.id} msg={t.msg} type={t.type} onClose={()=>rmToast(t.id)}/>)}
    {confirm&&<Confirm msg={confirm.msg} onY={()=>doConfirm(true)} onN={()=>doConfirm(false)}/>}
    <div className="layout">
      {isMob&&<div className={`sidebar-overlay${sideOpen?" on":""}`} onClick={closeSide}/>}
      <div className={`sidebar-wrap${sideOpen?" open":" closed"}`}>
        <Sidebar page={page} setPage={p=>{setPage(p);closeSide();}} user={user} onLogout={logout}
          canLog={canLog} canUsers={canUsers} fbOk={fbOk} syncing={syncing}
          dark={dark} onTheme={toggleTheme} sideOpen={sideOpen} onToggle={toggleSide}
          onReconnect={()=>{setFbOk(null);setDb(null);initFB().then(ok=>{setFbOk(ok);});}}/>
      </div>
      <div className="main">
        <div className="topbar">
          <button onClick={toggleSide} style={{background:"none",border:"none",cursor:"pointer",fontSize:22,color:"#94a3b8",padding:4,lineHeight:1}}>☰</button>
          <div style={{display:"flex",alignItems:"center",gap:8}}>
            <div style={{width:26,height:26,background:"linear-gradient(135deg,#1d4ed8,#7c3aed)",borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",fontSize:13}}>✝</div>
            <span style={{fontSize:14,fontWeight:700,color:"#f1f5f9"}}>Gestão Financeira</span>
          </div>
          <div style={{marginLeft:"auto",display:"flex",alignItems:"center",gap:8}}>
            <span style={{width:8,height:8,borderRadius:"50%",background:fbOk?"#22c55e":"#f59e0b",display:"inline-block"}}/>
            <button onClick={toggleTheme} style={{background:"none",border:"none",cursor:"pointer",fontSize:18,padding:4}}>{dark?"🌙":"☀️"}</button>
          </div>
        </div>
        {page==="dashboard"&&<DashPage db={db} toast={toast} fbOk={fbOk}/>}
        {page==="income"&&<IncomePage db={db} updateDb={updateDb} user={user} toast={toast} confirm2={confirm2} addLog={addLog} fbOk={fbOk}/>}
        {page==="expenses"&&<ExpPage db={db} updateDb={updateDb} user={user} toast={toast} confirm2={confirm2} addLog={addLog} fbOk={fbOk}/>}
        {page==="users"&&canUsers&&<UsersPage db={db} updateDb={updateDb} user={user} toast={toast} confirm2={confirm2} addLog={addLog} fbOk={fbOk}/>}
        {page==="logs"&&canLog&&<LogPage db={db}/>}
        {page==="profile"&&<ProfilePage user={user} db={db} updateDb={updateDb} setUser={setUser} toast={toast} addLog={addLog} fbOk={fbOk}/>}
      </div>
    </div>
  </>;
}

// ─── LOGIN ────────────────────────────────────────────────────────
function Login({db,onLogin,toast}){
  const [u,setU]=useState("");const [p,setP]=useState("");const [show,setShow]=useState(false);const [loading,setLoading]=useState(false);
  const tries=useRef({n:0,ts:0});
  const go=()=>{
    if(!u||!p){toast("Preencha usuário e senha","error");return;}
    const now2=Date.now();if(now2-tries.current.ts>60000)tries.current={n:0,ts:now2};
    if(tries.current.n>=5){toast("Muitas tentativas. Aguarde 1 minuto.","error");return;}
    setLoading(true);
    setTimeout(()=>{
      const q=u.toLowerCase().trim();
      const found=(db.users||[]).find(x=>(
        (x.username&&x.username.toLowerCase()===q)||
        (x.email&&x.email.toLowerCase()===q)||
        x.name.toLowerCase()===q
      )&&x.password===p&&x.active);
      if(found){tries.current.n=0;onLogin(found);}
      else{tries.current.n++;toast(`Credenciais inválidas${tries.current.n>=3?` (${5-tries.current.n} restantes)`:""}` ,"error");setLoading(false);}
    },600);
  };
  return <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",padding:16,background:"linear-gradient(135deg,#0f172a,#1e3a5f,#0f172a)"}}>
    <div style={{background:"var(--card)",borderRadius:20,padding:"40px 32px",width:"100%",maxWidth:400,boxShadow:"0 30px 80px rgba(0,0,0,.4)",animation:"fadeIn .4s ease"}}>
      <div style={{textAlign:"center",marginBottom:32}}>
        <div style={{width:64,height:64,background:"linear-gradient(135deg,#1d4ed8,#7c3aed)",borderRadius:"50%",margin:"0 auto 14px",display:"flex",alignItems:"center",justifyContent:"center",boxShadow:"0 8px 24px rgba(124,58,237,.35)"}}>
          <span style={{fontSize:28,color:"#fff"}}>✝</span>
        </div>
        <h1 style={{fontSize:21,fontWeight:800,color:"var(--t1)",marginBottom:4}}>Gestão Financeira</h1>

  const sf=(k,v)=>setForm(f=>({...f,[k]:v}));
  const reset=()=>{setForm(blank);setPrev(null);setEditing(null);setShowF(false);};

  const yrs=[...new Set((db.income||[]).map(i=>new Date(i.date).getFullYear()))].sort((a,b)=>b-a);
  const usrs=[...new Set((db.income||[]).map(i=>i.createdBy).filter(Boolean))];
  const hasF=fY!=="all"||fM!=="all"||fT!=="all"||fU!=="all";

  const save=async()=>{
    if(!form.description||!form.amount){toast("Preencha os campos obrigatórios","error");return;}
    setSaving(true);const amt=parseFloat(form.amount);
    if(editing){
      const upd={...((db.income||[]).find(i=>i.id===editing)||{}),...form,amount:amt};
      await updateDb({...db,income:(db.income||[]).map(i=>i.id===editing?upd:i)},fbOk?[{t:"set",col:COL.income,id:editing,d:upd}]:[]);
      addLog("EDITAR_ENTRADA",`Editou: "${form.description}" — ${fmt(amt)}`,editing);toast("Entrada atualizada!");
    }else{
      const status=isAg?"pendente":"aprovado";const id="i"+uid();
      const e={...form,amount:amt,id,status,createdBy:user.name,createdAt:now(),...(status==="aprovado"?{approvedBy:user.name,approvedAt:now()}:{})};
      await updateDb({...db,income:[...(db.income||[]),e]},fbOk?[{t:"set",col:COL.income,id,d:e}]:[]);
      addLog(isAg?"INSERIR_ENTRADA_PENDENTE":"INSERIR_ENTRADA",`${isAg?"Enviou para aprovação":"Inseriu"}: "${e.description}" — ${fmt(amt)}`);
      toast(isAg?"Enviado para aprovação! ⏳":"Entrada adicionada!");
    }
    setSaving(false);reset();
  };

  const approve=async id=>{const item=(db.income||[]).find(i=>i.id===id);if(!await confirm2(`Aprovar "${item.description}" — ${fmt(item.amount)}?`))return;
    const upd={...item,status:"aprovado",approvedBy:user.name,approvedAt:now()};
    await updateDb({...db,income:(db.income||[]).map(i=>i.id===id?upd:i)},fbOk?[{t:"set",col:COL.income,id,d:upd}]:[]);
    addLog("APROVAR_ENTRADA",`Aprovou: "${item.description}" — ${fmt(item.amount)}`,id);toast("Aprovado! ✅");};

  const reject=async id=>{const item=(db.income||[]).find(i=>i.id===id);if(!await confirm2(`Rejeitar "${item.description}"?`))return;
    await updateDb({...db,income:(db.income||[]).filter(i=>i.id!==id)},fbOk?[{t:"del",col:COL.income,id}]:[]);
    addLog("REJEITAR_ENTRADA",`Rejeitou: "${item.description}"`,id);toast("Rejeitado","warning");};

  const del=async id=>{const item=(db.income||[]).find(i=>i.id===id);if(!await confirm2("Excluir esta entrada?"))return;
    await updateDb({...db,income:(db.income||[]).filter(i=>i.id!==id)},fbOk?[{t:"del",col:COL.income,id}]:[]);
    addLog("EXCLUIR_ENTRADA",`Excluiu: "${item?.description}"`,id);toast("Excluída","warning");};

  const startEdit=item=>{setEditing(item.id);setForm({type:item.type,description:item.description,amount:String(item.amount),date:item.date,receipt:item.receipt});setPrev(item.receipt);setShowF(true);setTimeout(()=>window.scrollTo({top:0,behavior:"smooth"}),50);};

  const handleFile=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{setPrev(ev.target.result);sf("receipt",ev.target.result)};r.readAsDataURL(f);};

  let rows=[...(db.income||[])];
  if(fSt!=="all")rows=rows.filter(i=>i.status===fSt);
  rows=rows.filter(i=>{const d=new Date(i.date);return(fY==="all"||d.getFullYear()===+fY)&&(fM==="all"||d.getMonth()===+fM)&&(fT==="all"||i.type===fT)&&(fU==="all"||i.createdBy===fU);});
  rows=rows.sort((a,b)=>(b.createdAt||b.date).localeCompare(a.createdAt||a.date));
  if(isAg)rows=rows.filter(i=>i.createdBy===user.name);
  const totApp=(db.income||[]).filter(i=>i.status==="aprovado").reduce((s,i)=>s+i.amount,0);
  const pend=(db.income||[]).filter(i=>i.status==="pendente");

  return <div className="page" style={{padding:"clamp(14px,4vw,28px)"}}>
    <PH title="Entradas Financeiras" sub={isAg?"Suas entradas (aprovação necessária)":"Dízimos e ofertas"}>
      <div style={{display:"flex",gap:10,flexWrap:"wrap",alignItems:"center"}}>
        {!isAg&&<Pill c="#059669" bg="#ecfdf5">Aprovado: {fmt(totApp)}</Pill>}
        {pend.length>0&&!isAg&&<Pill c="#d97706" bg="#fef9c3">⏳ {pend.length} pendente{pend.length>1?"s":""}</Pill>}
        {cC&&!isRO&&<Btn color="#059669" onClick={()=>setShowF(true)}>{isAg?"+ Enviar Entrada":"+ Nova Entrada"}</Btn>}
      </div>
    </PH>
    {/* Filtros */}
    {!isAg&&<div className="frow" style={{display:"flex",gap:8,marginBottom:16,flexWrap:"wrap",alignItems:"center",background:"var(--card)",padding:"10px 12px",borderRadius:12,border:"1px solid var(--border)"}}>
      <span style={{fontSize:11,fontWeight:700,color:"var(--t3)"}}>🔍</span>
      <select value={fSt} onChange={e=>setFSt(e.target.value)} style={{...IS,width:"auto",padding:"5px 8px",fontSize:12}}><option value="all">Todos status</option><option value="aprovado">✅ Aprovadas</option><option value="pendente">⏳ Pendentes</option></select>
      <select value={fY} onChange={e=>setFY(e.target.value)} style={{...IS,width:"auto",padding:"5px 8px",fontSize:12}}><option value="all">Todos anos</option>{yrs.map(y=><option key={y} value={String(y)}>{y}</option>)}</select>
      <select value={fM} onChange={e=>setFM(e.target.value)} style={{...IS,width:"auto",padding:"5px 8px",fontSize:12}}><option value="all">Todos meses</option>{MO.map((m,i)=><option key={i} value={String(i)}>{m}</option>)}</select>
      <select value={fT} onChange={e=>setFT(e.target.value)} style={{...IS,width:"auto",padding:"5px 8px",fontSize:12}}><option value="all">Todos tipos</option><option value="dizimo">Dízimo</option><option value="oferta">Oferta</option></select>
      {usrs.length>0&&<select value={fU} onChange={e=>setFU(e.target.value)} style={{...IS,width:"auto",padding:"5px 8px",fontSize:12}}><option value="all">Todos usuários</option>{usrs.map(u=><option key={u} value={u}>{u}</option>)}</select>}
      {hasF&&<button onClick={()=>{setFY("all");setFM("all");setFT("all");setFU("all");setFSt("all");}} style={{padding:"5px 10px",background:"var(--card2)",border:"1px solid var(--border)",borderRadius:7,fontSize:11,color:"var(--t3)",cursor:"pointer"}}>✕ Limpar</button>}
      <span style={{marginLeft:"auto",fontSize:11,color:"var(--t4)"}}>{rows.length} registro{rows.length!==1?"s":""}</span>
    </div>}
    {isAg&&<div style={{background:"#0d1f3c",border:"1px solid #1e3a8a",borderRadius:12,padding:"12px 16px",marginBottom:20,fontSize:13,color:"#93c5fd"}}>💡 Suas entradas aguardam aprovação do <strong>Gestor</strong> antes de serem contabilizadas.</div>}
    {showF&&<FC title={editing?"Editar Entrada":isAg?"Enviar para Aprovação":"Nova Entrada"} onClose={reset}>
      {isAg&&!editing&&<div style={{background:"#1a1200",border:"1px solid #78500a",borderRadius:8,padding:"10px 14px",marginBottom:14,fontSize:12,color:"#fbbf24",fontWeight:600}}>⏳ Esta entrada aguardará aprovação do Gestor.</div>}
      <div className="fg2" style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14}}>
        <Fld label="Tipo *"><select value={form.type} onChange={e=>sf("type",e.target.value)} style={IS}><option value="dizimo">Dízimo</option><option value="oferta">Oferta</option></select></Fld>
        <Fld label="Valor (R$) *"><input type="number" step="0.01" min="0.01" max="9999999" value={form.amount} onChange={e=>sf("amount",e.target.value)} placeholder="0,00" style={IS}/></Fld>
        <Fld label="Descrição *" span><input maxLength={200} value={form.description} onChange={e=>sf("description",e.target.value)} placeholder="Ex: Dízimo culto domingo" style={IS}/></Fld>
        <Fld label="Data *"><input type="date" value={form.date} onChange={e=>sf("date",e.target.value)} style={IS}/></Fld>
        <Fld label="📎 Comprovante">
          <div style={{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
            <button onClick={()=>fileRef.current.click()} style={{padding:"8px 12px",border:"1.5px dashed var(--border)",borderRadius:9,background:"var(--card2)",color:"var(--t3)",fontSize:12,cursor:"pointer",fontWeight:600}}>📷 Selecionar</button>
            <input ref={fileRef} type="file" accept="image/*,application/pdf" onChange={handleFile} style={{display:"none"}}/>
            {prev&&<div style={{display:"flex",alignItems:"center",gap:8}}>
              {prev.startsWith("data:image")&&<img src={prev} alt="prev" style={{width:44,height:44,objectFit:"cover",borderRadius:6,border:"1px solid var(--border)"}}/>}
              <span style={{fontSize:11,color:"#059669",fontWeight:700}}>✓ Anexado</span>
              <button onClick={()=>{setPrev(null);sf("receipt",null);}} style={{background:"none",border:"none",color:"#ef4444",cursor:"pointer",fontSize:14}}>✕</button>
            </div>}
          </div>
        </Fld>
      </div>
      <FA onSave={save} onCancel={reset} loading={saving} label={isAg&&!editing?"Enviar para Aprovação":"Salvar"}/>
    </FC>}
    <div style={{background:"var(--card)",borderRadius:14,border:"1px solid var(--border)",overflow:"auto"}}>
      <table style={{minWidth:860}}>
        <thead><tr style={{background:"var(--card2)"}}>{["Status","Tipo","Descrição","Data","Valor","Inserido por","Aprovado por","Comprovante","Ações"].map(h=><th key={h} style={{padding:"11px 12px",fontSize:10,fontWeight:700,color:"var(--t3)",textTransform:"uppercase",letterSpacing:.5,borderBottom:"1px solid var(--border)",whiteSpace:"nowrap"}}>{h}</th>)}</tr></thead>
        <tbody>
          {rows.length===0&&<tr><td colSpan={9} style={{padding:32,textAlign:"center",color:"var(--t4)",fontSize:13}}>Nenhuma entrada encontrada.</td></tr>}
          {rows.map((item,i)=>{const pn=item.status==="pendente";return <tr key={item.id} style={{borderBottom:"1px solid var(--border)",background:pn?"#1a1200":i%2===0?"var(--card)":"var(--card2)"}}>
            <td style={{padding:"10px 12px"}}><Pill c={pn?"#d97706":"#059669"} bg={pn?"#1a1200":"#0a1f0a"}>{pn?"⏳ Pendente":"✅ Aprovado"}</Pill></td>
            <td style={{padding:"10px 12px"}}><Pill c={item.type==="dizimo"?"#1d4ed8":"#7c3aed"} bg={item.type==="dizimo"?"#0d1f3c":"#1a0d3c"}>{IL[item.type]}</Pill></td>
            <td style={{padding:"10px 12px",fontSize:13,color:"var(--t2)"}}>{item.description}</td>
            <td style={{padding:"10px 12px",fontSize:12,color:"var(--t3)",whiteSpace:"nowrap"}}>{fmtD(item.date)}</td>
            <td style={{padding:"10px 12px",fontSize:13,fontWeight:800,color:pn?"#d97706":"#059669",whiteSpace:"nowrap"}}>{fmt(item.amount)}</td>
            <td style={{padding:"10px 12px",fontSize:11,color:"var(--t3)"}}>{item.createdBy||"—"}</td>
            <td style={{padding:"10px 12px",fontSize:11,color:"var(--t3)"}}>{item.approvedBy||"—"}</td>
            <td style={{padding:"10px 12px"}}>{item.receipt?<button onClick={()=>window.open(item.receipt)} style={{padding:"4px 10px",background:"#0d1f3c",border:"1px solid #1e3a8a",borderRadius:6,color:"#60a5fa",fontSize:11,cursor:"pointer",fontWeight:600}}>Ver 📎</button>:<span style={{fontSize:11,color:"var(--t4)"}}>—</span>}</td>
            <td style={{padding:"10px 12px"}}><div style={{display:"flex",gap:5,flexWrap:"nowrap"}}>
              {pn&&cAp&&<SBtn c="#059669" bg="#0a1f0a" bd="#166534" onClick={()=>approve(item.id)}>✅ Aprovar</SBtn>}
              {pn&&cAp&&<SBtn c="#dc2626" bg="#1a0a0a" bd="#7f1d1d" onClick={()=>reject(item.id)}>❌ Rejeitar</SBtn>}
              {!pn&&cE&&!isAg&&<SBtn c="#059669" bg="#0a1f0a" bd="#166534" onClick={()=>startEdit(item)}>Editar</SBtn>}
              {cD&&!isAg&&<SBtn c="#dc2626" bg="#1a0a0a" bd="#7f1d1d" onClick={()=>del(item.id)}>Excluir</SBtn>}
              {isRO&&<span style={{fontSize:11,color:"var(--t4)"}}>leitura</span>}
            </div></td>
          </tr>;})}
        </tbody>
      </table>
    </div>
  </div>;
}

// ─── EXPENSES PAGE ────────────────────────────────────────────────
function ExpPage({db,updateDb,user,toast,confirm2,addLog,fbOk}){
  const isRO=user.role==="auditor"||user.role==="agente";
  const cC=["master","gestor"].includes(user.role)||can(user,"createExpense");
  const cE=["master","gestor"].includes(user.role)||can(user,"editExpense");
  const cD=["master","gestor"].includes(user.role)||can(user,"deleteExpense");
  const blank={category:"Conta de Luz",custom:"",useC:false,type:"fixo",amount:"",date:new Date().toISOString().slice(0,10),description:""};
  const [showF,setShowF]=useState(false);const [editing,setEditing]=useState(null);const [form,setForm]=useState(blank);const [saving,setSaving]=useState(false);
  const [fY,setFY]=useState("all");const [fM,setFM]=useState("all");const [fT,setFT]=useState("all");const [fC,setFC]=useState("all");const [fU,setFU]=useState("all");
  const sf=(k,v)=>setForm(f=>({...f,[k]:v}));const reset=()=>{setForm(blank);setEditing(null);setShowF(false);};

  const yrs=[...new Set((db.expenses||[]).map(e=>new Date(e.date).getFullYear()))].sort((a,b)=>b-a);
  const cats=[...new Set((db.expenses||[]).map(e=>e.category))];
  const usrs=[...new Set((db.expenses||[]).map(e=>e.createdBy).filter(Boolean))];

  const save=async()=>{
    const cat=form.useC?form.custom:form.category;
    if(!cat||!form.amount){toast("Preencha todos os campos","error");return;}
    setSaving(true);const amt=parseFloat(form.amount);
    const entry={category:cat,type:form.type,amount:amt,date:form.date,description:form.description};
    if(editing){
      const upd={...((db.expenses||[]).find(e=>e.id===editing)||{}),...entry};
      await updateDb({...db,expenses:(db.expenses||[]).map(e=>e.id===editing?upd:e)},fbOk?[{t:"set",col:COL.expenses,id:editing,d:upd}]:[]);
      addLog("EDITAR_CUSTO",`Editou: "${cat}" — ${fmt(amt)}`,editing);toast("Custo atualizado!");
    }else{
      const id="e"+uid();const ne={...entry,id,createdBy:user.name,createdAt:now()};
      await updateDb({...db,expenses:[...(db.expenses||[]),ne]},fbOk?[{t:"set",col:COL.expenses,id,d:ne}]:[]);
      addLog("INSERIR_CUSTO",`Inseriu: "${cat}" — ${fmt(amt)}`);toast("Custo adicionado!");
    }
    setSaving(false);reset();
  };

  const del=async id=>{const item=(db.expenses||[]).find(e=>e.id===id);if(!await confirm2("Excluir este custo?"))return;
    await updateDb({...db,expenses:(db.expenses||[]).filter(e=>e.id!==id)},fbOk?[{t:"del",col:COL.expenses,id}]:[]);
    addLog("EXCLUIR_CUSTO",`Excluiu: "${item?.category}" — ${fmt(item?.amount||0)}`,id);toast("Excluído","warning");};

  const startEdit=item=>{setEditing(item.id);const isCust=!CATS.includes(item.category);setForm({category:isCust?"Conta de Luz":item.category,custom:isCust?item.category:"",useC:isCust,type:item.type,amount:String(item.amount),date:item.date,description:item.description});setShowF(true);setTimeout(()=>window.scrollTo({top:0,behavior:"smooth"}),50);};

  let rows=[...(db.expenses||[])].filter(e=>{const d=new Date(e.date);return(fY==="all"||d.getFullYear()===+fY)&&(fM==="all"||d.getMonth()===+fM)&&(fT==="all"||e.type===fT)&&(fC==="all"||e.category===fC)&&(fU==="all"||e.createdBy===fU);}).sort((a,b)=>(b.createdAt||b.date).localeCompare(a.createdAt||a.date));
  const tot=(db.expenses||[]).reduce((s,e)=>s+e.amount,0);const fTot=rows.reduce((s,e)=>s+e.amount,0);
  const hasF=fY!=="all"||fM!=="all"||fT!=="all"||fC!=="all"||fU!=="all";

  return <div className="page" style={{padding:"clamp(14px,4vw,28px)"}}>
    <PH title="Registro de Custos" sub={isRO?"Visualização somente leitura":"Fixos, variáveis e imprevistos"}>
      <div style={{display:"flex",gap:10,alignItems:"center"}}>
        <Pill c="#dc2626" bg="#1a0a0a">Total: {fmt(tot)}</Pill>
        {cC&&!isRO&&<Btn color="#dc2626" onClick={()=>setShowF(true)}>+ Novo Custo</Btn>}
      </div>
    </PH>
    {isRO&&<div style={{background:"#0d1f3c",border:"1px solid #1e3a8a",borderRadius:12,padding:"12px 16px",marginBottom:16,fontSize:13,color:"#93c5fd"}}>🔒 Somente visualização.</div>}
    <div style={{display:"flex",gap:8,marginBottom:12,flexWrap:"wrap"}}>
      {Object.entries(ET).map(([k,v])=><span key={k} style={{padding:"5px 12px",borderRadius:8,background:EC[k]+"18",color:EC[k],fontSize:11,fontWeight:700,border:`1px solid ${EC[k]}35`}}>{v}</span>)}
    </div>
    <div className="frow" style={{display:"flex",gap:8,marginBottom:16,flexWrap:"wrap",alignItems:"center",background:"var(--card)",padding:"10px 12px",borderRadius:12,border:"1px solid var(--border)"}}>
      <span style={{fontSize:11,fontWeight:700,color:"var(--t3)"}}>🔍</span>
      <select value={fY} onChange={e=>setFY(e.target.value)} style={{...IS,width:"auto",padding:"5px 8px",fontSize:12}}><option value="all">Todos anos</option>{yrs.map(y=><option key={y} value={String(y)}>{y}</option>)}</select>
      <select value={fM} onChange={e=>setFM(e.target.value)} style={{...IS,width:"auto",padding:"5px 8px",fontSize:12}}><option value="all">Todos meses</option>{MO.map((m,i)=><option key={i} value={String(i)}>{m}</option>)}</select>
      <select value={fT} onChange={e=>setFT(e.target.value)} style={{...IS,width:"auto",padding:"5px 8px",fontSize:12}}><option value="all">Todos tipos</option>{Object.entries(ET).map(([k,v])=><option key={k} value={k}>{v}</option>)}</select>
      {cats.length>0&&<select value={fC} onChange={e=>setFC(e.target.value)} style={{...IS,width:"auto",padding:"5px 8px",fontSize:12}}><option value="all">Todas categorias</option>{cats.map(c=><option key={c} value={c}>{c}</option>)}</select>}
      {usrs.length>0&&<select value={fU} onChange={e=>setFU(e.target.value)} style={{...IS,width:"auto",padding:"5px 8px",fontSize:12}}><option value="all">Todos usuários</option>{usrs.map(u=><option key={u} value={u}>{u}</option>)}</select>}
      {hasF&&<><button onClick={()=>{setFY("all");setFM("all");setFT("all");setFC("all");setFU("all");}} style={{padding:"5px 10px",background:"var(--card2)",border:"1px solid var(--border)",borderRadius:7,fontSize:11,color:"var(--t3)",cursor:"pointer"}}>✕ Limpar</button><Pill c="#dc2626" bg="#1a0a0a">Filtrado: {fmt(fTot)}</Pill></>}
      <span style={{marginLeft:"auto",fontSize:11,color:"var(--t4)"}}>{rows.length} registro{rows.length!==1?"s":""}</span>
    </div>
    {showF&&<FC title={editing?"Editar Custo":"Novo Custo"} onClose={reset}>
      <div className="fg2" style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14}}>
        <Fld label="Categoria *">
          <select value={form.useC?"__c__":form.category} onChange={e=>{if(e.target.value==="__c__")sf("useC",true);else{sf("useC",false);sf("category",e.target.value);}}} style={IS}>
            {CATS.map(c=><option key={c} value={c}>{c}</option>)}<option value="__c__">+ Personalizado...</option>
          </select>
          {form.useC&&<input maxLength={80} value={form.custom} onChange={e=>sf("custom",e.target.value)} placeholder="Nome personalizado" style={{...IS,marginTop:8}}/>}
        </Fld>
        <Fld label="Tipo *"><select value={form.type} onChange={e=>sf("type",e.target.value)} style={IS}><option value="fixo">🟢 Custo Fixo</option><option value="variavel">🟣 Custo Variável</option><option value="imprevisto">🔴 Imprevisto</option></select></Fld>
        <Fld label="Valor (R$) *"><input type="number" step="0.01" min="0.01" max="9999999" value={form.amount} onChange={e=>sf("amount",e.target.value)} placeholder="0,00" style={IS}/></Fld>
        <Fld label="Data *"><input type="date" value={form.date} onChange={e=>sf("date",e.target.value)} style={IS}/></Fld>
        <Fld label="Descrição" span><input maxLength={200} value={form.description} onChange={e=>sf("description",e.target.value)} placeholder="Detalhes..." style={IS}/></Fld>
      </div>
      <FA onSave={save} onCancel={reset} color="#dc2626" loading={saving}/>
    </FC>}
    <div style={{background:"var(--card)",borderRadius:14,border:"1px solid var(--border)",overflow:"auto"}}>
      <table style={{minWidth:760}}>
        <thead><tr style={{background:"var(--card2)"}}>{["Categoria","Tipo","Descrição","Data","Valor","Inserido por","Ações"].map(h=><th key={h} style={{padding:"11px 12px",fontSize:10,fontWeight:700,color:"var(--t3)",textTransform:"uppercase",letterSpacing:.5,borderBottom:"1px solid var(--border)"}}>{h}</th>)}</tr></thead>
        <tbody>
          {rows.length===0&&<tr><td colSpan={7} style={{padding:32,textAlign:"center",color:"var(--t4)",fontSize:13}}>Nenhum custo cadastrado.</td></tr>}
          {rows.map((item,i)=><tr key={item.id} style={{borderBottom:"1px solid var(--border)",background:i%2===0?"var(--card)":"var(--card2)"}}>
            <td style={{padding:"11px 12px",fontSize:13,fontWeight:700,color:"var(--t1)"}}>{item.category}</td>
            <td style={{padding:"11px 12px"}}><Pill c={EC[item.type]} bg={EC[item.type]+"18"}>{ET[item.type]}</Pill></td>
            <td style={{padding:"11px 12px",fontSize:12,color:"var(--t3)"}}>{item.description||"—"}</td>
            <td style={{padding:"11px 12px",fontSize:12,color:"var(--t3)",whiteSpace:"nowrap"}}>{fmtD(item.date)}</td>
            <td style={{padding:"11px 12px",fontSize:13,fontWeight:800,color:"#dc2626",whiteSpace:"nowrap"}}>{fmt(item.amount)}</td>
            <td style={{padding:"11px 12px",fontSize:11,color:"var(--t3)"}}>{item.createdBy||"—"}</td>
            <td style={{padding:"11px 12px"}}><div style={{display:"flex",gap:6}}>
              {cE&&!isRO&&<SBtn c="#059669" bg="#0a1f0a" bd="#166534" onClick={()=>startEdit(item)}>Editar</SBtn>}
              {cD&&!isRO&&<SBtn c="#dc2626" bg="#1a0a0a" bd="#7f1d1d" onClick={()=>del(item.id)}>Excluir</SBtn>}
              {isRO&&<span style={{fontSize:11,color:"var(--t4)"}}>somente leitura</span>}
            </div></td>
          </tr>)}
        </tbody>
      </table>
    </div>
  </div>;
}

// ─── LOG PAGE ─────────────────────────────────────────────────────
const LC={INSERIR_ENTRADA:"#059669",INSERIR_ENTRADA_PENDENTE:"#d97706",EDITAR_ENTRADA:"#0d9488",EXCLUIR_ENTRADA:"#dc2626",APROVAR_ENTRADA:"#059669",REJEITAR_ENTRADA:"#dc2626",INSERIR_CUSTO:"#7c3aed",EDITAR_CUSTO:"#0d9488",EXCLUIR_CUSTO:"#dc2626",CRIAR_USUARIO:"#1d4ed8",EDITAR_USUARIO:"#0d9488",EXCLUIR_USUARIO:"#dc2626",DESATIVAR_USUARIO:"#d97706",ATIVAR_USUARIO:"#059669",ATUALIZAR_CREDENCIAIS:"#7c3aed"};
const LI={INSERIR_ENTRADA:"💰",INSERIR_ENTRADA_PENDENTE:"⏳",EDITAR_ENTRADA:"✏️",EXCLUIR_ENTRADA:"🗑️",APROVAR_ENTRADA:"✅",REJEITAR_ENTRADA:"❌",INSERIR_CUSTO:"📤",EDITAR_CUSTO:"✏️",EXCLUIR_CUSTO:"🗑️",CRIAR_USUARIO:"👤",EDITAR_USUARIO:"✏️",EXCLUIR_USUARIO:"🗑️",DESATIVAR_USUARIO:"🔒",ATIVAR_USUARIO:"🔓",ATUALIZAR_CREDENCIAIS:"🔑"};

function LogPage({db}){
  const [srch,setSrch]=useState("");const [fA,setFA]=useState("all");const [fU,setFU]=useState("all");
  const logs=db.logs||[];
  const acts=[...new Set(logs.map(l=>l.action))];
  const usrs=[...new Set(logs.map(l=>l.userName))];
  const rows=logs.filter(l=>{
    const ms=!srch||(l.details?.toLowerCase().includes(srch.toLowerCase())||l.userName?.toLowerCase().includes(srch.toLowerCase())||l.action?.toLowerCase().includes(srch.toLowerCase()));
    return ms&&(fA==="all"||l.action===fA)&&(fU==="all"||l.userName===fU);
  });
  return <div className="page" style={{padding:"clamp(14px,4vw,28px)"}}>
    <PH title="Histórico de Log" sub="Registro de todas as ações no sistema"><Pill c="#2563eb" bg="#0d1f3c">{logs.length} registro{logs.length!==1?"s":""}</Pill></PH>
    <div className="kgrid" style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:12,marginBottom:20}}>
      {[{lbl:"Total",val:logs.length,c:"#2563eb"},{lbl:"Entradas Inseridas",val:logs.filter(l=>["INSERIR_ENTRADA","INSERIR_ENTRADA_PENDENTE"].includes(l.action)).length,c:"#059669"},{lbl:"Aprovações",val:logs.filter(l=>l.action==="APROVAR_ENTRADA").length,c:"#0d9488"},{lbl:"Rejeições",val:logs.filter(l=>l.action==="REJEITAR_ENTRADA").length,c:"#dc2626"}].map((s,i)=><div key={i} style={{background:"var(--card)",borderRadius:12,padding:"14px 16px",border:"1px solid var(--border)"}}>
        <div style={{fontSize:10,fontWeight:700,color:"var(--t3)",textTransform:"uppercase",letterSpacing:.5,marginBottom:6}}>{s.lbl}</div>
        <div style={{fontSize:24,fontWeight:800,color:s.c}}>{s.val}</div>
      </div>)}
    </div>
    <div className="frow" style={{display:"flex",gap:10,marginBottom:16,flexWrap:"wrap"}}>
      <input value={srch} onChange={e=>setSrch(e.target.value)} placeholder="🔍 Buscar..." style={{...IS,flex:1,minWidth:200}}/>
      <select value={fA} onChange={e=>setFA(e.target.value)} style={{...IS,width:"auto"}}><option value="all">Todas as ações</option>{acts.map(a=><option key={a} value={a}>{LI[a]||"•"} {a.replace(/_/g," ")}</option>)}</select>
      <select value={fU} onChange={e=>setFU(e.target.value)} style={{...IS,width:"auto"}}><option value="all">Todos usuários</option>{usrs.map(u=><option key={u} value={u}>{u}</option>)}</select>
    </div>
    <div style={{background:"var(--card)",borderRadius:14,border:"1px solid var(--border)",overflow:"auto"}}>
      <table style={{minWidth:760}}>
        <thead><tr style={{background:"var(--card2)"}}>{["Data/Hora","Usuário","Perfil","Ação","Detalhes"].map(h=><th key={h} style={{padding:"11px 14px",fontSize:10,fontWeight:700,color:"var(--t3)",textTransform:"uppercase",letterSpacing:.5,borderBottom:"1px solid var(--border)"}}>{h}</th>)}</tr></thead>
        <tbody>
          {rows.length===0&&<tr><td colSpan={5} style={{padding:40,textAlign:"center",color:"var(--t4)",fontSize:13}}>{logs.length===0?"Nenhuma ação registrada ainda.":"Nenhum resultado."}</td></tr>}
          {rows.map((log,i)=>{const cl=LC[log.action]||"#64748b";const ic=LI[log.action]||"•";return <tr key={log.id||i} style={{borderBottom:"1px solid var(--border)",background:i%2===0?"var(--card)":"var(--card2)"}}>
            <td style={{padding:"10px 14px",fontSize:11,color:"var(--t3)",whiteSpace:"nowrap"}}>{fmtDT(log.timestamp)}</td>
            <td style={{padding:"10px 14px"}}><div style={{fontSize:12,fontWeight:700,color:"var(--t1)"}}>{log.userName}</div></td>
            <td style={{padding:"10px 14px"}}><Pill c={RC[log.userRole]||"#64748b"} bg={(RC[log.userRole]||"#64748b")+"22"}>{RL[log.userRole]||log.userRole}</Pill></td>
            <td style={{padding:"10px 14px"}}><span style={{display:"inline-flex",alignItems:"center",gap:6,padding:"4px 10px",borderRadius:7,background:cl+"20",color:cl,fontSize:11,fontWeight:700,whiteSpace:"nowrap"}}>{ic} {log.action.replace(/_/g," ")}</span></td>
            <td style={{padding:"10px 14px",fontSize:12,color:"var(--t2)"}}>{log.details}</td>
          </tr>;})}</tbody></table></div></div>;
}

// ─── USERS PAGE ───────────────────────────────────────────────────
const PERMS=[["createIncome","Criar Entradas"],["editIncome","Editar Entradas"],["deleteIncome","Excluir Entradas"],["createExpense","Criar Custos"],["editExpense","Editar Custos"],["deleteExpense","Excluir Custos"]];

function UsersPage({db,updateDb,user,toast,confirm2,addLog,fbOk}){
  const blankP=Object.fromEntries(PERMS.map(([k])=>[k,false]));
  const blank={name:"",username:"",email:"",password:"",role:"editor",active:true,perms:{...blankP}};
  const [showF,setShowF]=useState(false);const [editId,setEditId]=useState(null);const [form,setForm]=useState(blank);const [saving,setSaving]=useState(false);const [errs,setErrs]=useState({});
  const sf=(k,v)=>{setForm(f=>({...f,[k]:v}));setErrs(e=>({...e,[k]:null}));};
  const sp=(k,v)=>setForm(f=>({...f,perms:{...f.perms,[k]:v}}));
  const reset=()=>{setForm(blank);setEditId(null);setShowF(false);setErrs({});};

  const save=async()=>{
    const e={};if(!form.name.trim())e.name="Obrigatório";if(!form.username.trim())e.username="Obrigatório";
    else if(!/^[a-zA-Z0-9._@-]+$/.test(form.username))e.username="Apenas letras, números, . _ @ -";
    if(!editId&&!form.password)e.password="Obrigatório";
    const all=db.users||[];
    if(form.username.trim()&&all.find(u=>u.username&&u.username.toLowerCase()===form.username.toLowerCase()&&u.id!==editId))e.username="Nome de usuário já em uso";
    if(form.email.trim()&&all.find(u=>u.email&&u.email.toLowerCase()===form.email.toLowerCase()&&u.id!==editId))e.email="E-mail já cadastrado";
    if(Object.keys(e).length){setErrs(e);toast("Corrija os erros indicados","error");return;}
    setSaving(true);const id=editId||"u"+uid();const ex=editId?all.find(u=>u.id===editId)||{}:{};
    const nu={...ex,...form,id,username:form.username.trim(),name:form.name.trim(),email:form.email.trim(),password:form.password||ex.password,createdAt:ex.createdAt||now()};
    await updateDb({...db,users:editId?all.map(u=>u.id===editId?nu:u):[...all,nu]},fbOk?[{t:"set",col:COL.users,id,d:nu}]:[]);
    addLog(editId?"EDITAR_USUARIO":"CRIAR_USUARIO",`${editId?"Editou":"Criou"} @${nu.username} (${RL[nu.role]})`,id);
    toast(editId?"Usuário atualizado!":"Usuário criado!");setSaving(false);reset();
  };

  const toggleActive=async id=>{const u=(db.users||[]).find(u=>u.id===id);const upd={...u,active:!u.active};const all=db.users||[];
    await updateDb({...db,users:all.map(x=>x.id===id?upd:x)},fbOk?[{t:"set",col:COL.users,id,d:upd}]:[]);
    addLog(u.active?"DESATIVAR_USUARIO":"ATIVAR_USUARIO",`${u.active?"Desativou":"Ativou"} @${u.username||u.name}`,id);};

  const del=async id=>{if(id==="admin"){toast("Não é possível excluir o administrador","error");return;}const u=(db.users||[]).find(u=>u.id===id);
    if(!await confirm2(`Excluir permanentemente "${u?.name}"?`))return;
    await updateDb({...db,users:(db.users||[]).filter(u=>u.id!==id)},fbOk?[{t:"del",col:COL.users,id}]:[]);
    addLog("EXCLUIR_USUARIO",`Excluiu @${u?.username||u?.name} (${RL[u?.role]})`,id);toast("Usuário excluído","warning");};

  const startEdit=u=>{setEditId(u.id);setForm({name:u.name,username:u.username||"",email:u.email||"",password:"",role:u.role,active:u.active,perms:{...blankP,...(u.perms||{})}});setErrs({});setShowF(true);setTimeout(()=>window.scrollTo({top:0,behavior:"smooth"}),50);};

  return <div className="page" style={{padding:"clamp(14px,4vw,28px)"}}>
    <PH title="Gerenciamento de Usuários" sub="Controle de acesso"><Btn color="#7c3aed" onClick={()=>setShowF(true)}>+ Novo Usuário</Btn></PH>
    <div className="kgrid" style={{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:10,marginBottom:20}}>
      {Object.entries(RL).map(([role,label])=><div key={role} style={{background:"var(--card)",borderRadius:10,padding:"12px 14px",border:"1px solid var(--border)",borderLeft:`4px solid ${RC[role]}`}}>
        <div style={{fontSize:12,fontWeight:800,color:RC[role],marginBottom:4}}>{label}</div>
        <div style={{fontSize:10,color:"var(--t3)",lineHeight:1.5}}>{RD[role]}</div>
      </div>)}
    </div>
    {showF&&<FC title={editId?"Editar Usuário":"Novo Usuário"} onClose={reset}>
      <div className="fg2" style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14,marginBottom:16}}>
        <Fld label="Nome completo *"><input maxLength={80} value={form.name} onChange={e=>sf("name",e.target.value)} placeholder="Nome completo" style={{...IS,borderColor:errs.name?"#dc2626":"var(--border-inp)"}}/>{errs.name&&<span style={{fontSize:11,color:"#dc2626",marginTop:4,display:"block"}}>{errs.name}</span>}</Fld>
        <Fld label="Nome de usuário (login) *"><input maxLength={40} value={form.username} onChange={e=>sf("username",e.target.value)} placeholder="@usuario" style={{...IS,borderColor:errs.username?"#dc2626":"var(--border-inp)"}}/>{errs.username?<span style={{fontSize:11,color:"#dc2626",marginTop:4,display:"block"}}>{errs.username}</span>:<span style={{fontSize:10,color:"var(--t4)",marginTop:3,display:"block"}}>Sem espaços. Usado para login.</span>}</Fld>
        <Fld label="E-mail (opcional)"><input maxLength={120} type="email" value={form.email} onChange={e=>sf("email",e.target.value)} placeholder="usuario@email.com" style={{...IS,borderColor:errs.email?"#dc2626":"var(--border-inp)"}}/>{errs.email&&<span style={{fontSize:11,color:"#dc2626",marginTop:4,display:"block"}}>{errs.email}</span>}</Fld>
        <Fld label={editId?"Nova senha (opcional)":"Senha *"}><input maxLength={100} type="password" value={form.password} onChange={e=>sf("password",e.target.value)} placeholder="••••••••" style={{...IS,borderColor:errs.password?"#dc2626":"var(--border-inp)"}}/>{errs.password&&<span style={{fontSize:11,color:"#dc2626",marginTop:4,display:"block"}}>{errs.password}</span>}</Fld>
        <Fld label="Perfil *" span><select value={form.role} onChange={e=>sf("role",e.target.value)} style={IS}><option value="gestor">Gestor — operações financeiras completas</option><option value="editor">Editor — permissões específicas</option><option value="auditor">Auditor — somente leitura + logs</option><option value="agente">Agente — insere entradas (requer aprovação)</option></select></Fld>
      </div>
      {form.role==="editor"&&<div style={{marginBottom:20}}><label style={{fontSize:12,fontWeight:700,color:"var(--t2)",display:"block",marginBottom:10}}>Permissões do Editor</label>
        <div className="fg2" style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8}}>
          {PERMS.map(([k,label])=><label key={k} style={{display:"flex",alignItems:"center",gap:8,fontSize:12,color:"var(--t2)",cursor:"pointer",padding:"9px 12px",border:`1px solid ${form.perms[k]?"#1e3a8a":"var(--border-inp)"}`,borderRadius:9,background:form.perms[k]?"#0d1f3c":"var(--card2)"}}>
            <input type="checkbox" checked={!!form.perms[k]} onChange={e=>sp(k,e.target.checked)}/>{label}
          </label>)}
        </div></div>}
      <FA onSave={save} onCancel={reset} color="#7c3aed" loading={saving}/>
    </FC>}
    <div style={{display:"flex",flexDirection:"column",gap:10}}>
      {(db.users||[]).map(u=><div key={u.id} style={{background:"var(--card)",borderRadius:12,padding:"16px 20px",border:"1px solid var(--border)",display:"flex",justifyContent:"space-between",alignItems:"center",gap:12,flexWrap:"wrap"}}>
        <div style={{display:"flex",alignItems:"center",gap:14}}>
          <div style={{width:44,height:44,background:RC[u.role]+"22",borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",fontSize:18,fontWeight:800,color:RC[u.role],flexShrink:0}}>{u.name.charAt(0).toUpperCase()}</div>
          <div>
            <div style={{fontWeight:700,fontSize:14,color:"var(--t1)"}}>{u.name}</div>
            <div style={{fontSize:12,color:"var(--t3)"}}>{u.username?`@${u.username}`:""}{u.email?` · ${u.email}`:""}</div>
            <div style={{marginTop:4,display:"flex",gap:6,flexWrap:"wrap"}}>
              <Pill c={RC[u.role]} bg={RC[u.role]+"22"}>{RL[u.role]}</Pill>
              <Pill c={u.active?"#059669":"#94a3b8"} bg={u.active?"#0a1f0a":"var(--card2)"}>{u.active?"Ativo":"Inativo"}</Pill>
            </div>
          </div>
        </div>
        {u.id!=="admin"?<div style={{display:"flex",gap:7,flexWrap:"wrap"}}>
          <SBtn c="#475569" bg="var(--card2)" bd="var(--border)" onClick={()=>toggleActive(u.id)}>{u.active?"Desativar":"Ativar"}</SBtn>
          <SBtn c="#60a5fa" bg="#0d1f3c" bd="#1e3a8a" onClick={()=>startEdit(u)}>Editar</SBtn>
          <SBtn c="#f87171" bg="#1a0a0a" bd="#7f1d1d" onClick={()=>del(u.id)}>Excluir</SBtn>
        </div>:<span style={{fontSize:11,color:"var(--t4)",fontStyle:"italic"}}>Conta protegida</span>}
      </div>)}
    </div>
  </div>;
}

// ─── PROFILE PAGE ─────────────────────────────────────────────────
function ProfilePage({user,db,updateDb,setUser,toast,addLog,fbOk}){
  const isAdmin=user.id==="admin";
  const [open,setOpen]=useState(false);
  const [f,setF]=useState({login:user.email||user.username,np:"",cp:"",cur:""});
  const [saving,setSaving]=useState(false);
  const sf=(k,v)=>setF(x=>({...x,[k]:v}));

  const save=async()=>{
    if(!f.login.trim()){toast("Nome de usuário vazio","error");return;}
    if(!f.cur){toast("Informe a senha atual","error");return;}
    if(f.cur!==user.password){toast("Senha atual incorreta","error");return;}
    if(f.np&&f.np!==f.cp){toast("Novas senhas não coincidem","error");return;}
    setSaving(true);
    const upd={...user,email:f.login.trim(),username:f.login.trim(),name:f.login.trim(),...(f.np?{password:f.np}:{})};
    await updateDb({...db,users:(db.users||[]).map(u=>u.id===user.id?upd:u)},fbOk?[{t:"set",col:COL.users,id:user.id,d:upd}]:[]);
    addLog("ATUALIZAR_CREDENCIAIS","Atualizou credenciais de acesso");
    setUser(upd);setF({login:upd.email,np:"",cp:"",cur:""});setOpen(false);setSaving(false);toast("Credenciais atualizadas!");
  };
  const permsA=Object.entries(user.perms||{}).filter(([,v])=>v).map(([k])=>k);

  return <div className="page" style={{padding:"clamp(14px,4vw,28px)",maxWidth:620}}>
    <PH title="Meu Perfil" sub="Informações da sua conta"/>
    <div style={{background:"var(--card)",borderRadius:14,padding:24,border:"1px solid var(--border)",marginBottom:20}}>
      <div style={{display:"flex",alignItems:"center",gap:16,marginBottom:20}}>
        <div style={{width:56,height:56,background:`linear-gradient(135deg,${RC[user.role]},#0f172a)`,borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",fontSize:22,color:"#fff",fontWeight:800,flexShrink:0}}>{user.name.charAt(0).toUpperCase()}</div>
        <div>
          <div style={{fontSize:18,fontWeight:800,color:"var(--t1)"}}>{user.name}</div>
          {user.username&&<div style={{fontSize:13,color:"var(--t3)",marginTop:2}}>@{user.username}</div>}
          <span style={{display:"inline-block",marginTop:6,padding:"3px 10px",background:RC[user.role]+"22",color:RC[user.role],borderRadius:6,fontSize:11,fontWeight:700}}>{RL[user.role]}</span>
        </div>
      </div>
      <div style={{background:"var(--card2)",borderRadius:10,padding:"14px 16px",fontSize:13,color:"var(--t3)",lineHeight:1.7}}>{RD[user.role]}</div>
      {user.role==="editor"&&permsA.length>0&&<div style={{marginTop:14}}><div style={{fontSize:12,fontWeight:700,color:"var(--t2)",marginBottom:8}}>Permissões ativas:</div><div style={{display:"flex",flexWrap:"wrap",gap:6}}>{permsA.map(k=><Pill key={k} c="#60a5fa" bg="#0d1f3c">{k}</Pill>)}</div></div>}
    </div>
    {isAdmin&&<div style={{background:"var(--card)",borderRadius:14,border:"1px solid var(--border)",overflow:"hidden",marginBottom:20}}>
      <button onClick={()=>setOpen(s=>!s)} style={{width:"100%",display:"flex",justifyContent:"space-between",alignItems:"center",padding:"18px 22px",background:"none",border:"none",cursor:"pointer",borderBottom:open?"1px solid var(--border)":"none"}}>
        <div style={{display:"flex",alignItems:"center",gap:10}}><span style={{fontSize:20}}>🔐</span><div style={{textAlign:"left"}}><div style={{fontSize:14,fontWeight:700,color:"var(--t1)"}}>Alterar Credenciais</div><div style={{fontSize:12,color:"var(--t3)",marginTop:2}}>Exclusivo do administrador</div></div></div>
        <span style={{fontSize:16,color:"var(--t4)",transform:open?"rotate(180deg)":"none",transition:"transform .2s"}}>▼</span>
      </button>
      {open&&<div style={{padding:"20px 22px"}}>
        <div style={{background:"#1a1200",border:"1px solid #78500a",borderRadius:10,padding:"12px 16px",fontSize:12,color:"#fbbf24",marginBottom:18,lineHeight:1.6}}>⚠️ <strong>Atenção:</strong> Anote as novas credenciais antes de salvar.</div>
        <div style={{display:"flex",flexDirection:"column",gap:14}}>
          <Fld label="Senha atual (obrigatória) *"><input type="password" maxLength={100} value={f.cur} onChange={e=>sf("cur",e.target.value)} placeholder="Senha atual" style={IS}/></Fld>
          <div style={{borderTop:"1px dashed var(--border)",paddingTop:14}}><div style={{fontSize:12,fontWeight:700,color:"var(--t2)",marginBottom:12}}>Novos dados (preencha o que deseja alterar)</div>
            <div className="fg2" style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
              <Fld label="Novo nome de usuário"><input maxLength={40} value={f.login} onChange={e=>sf("login",e.target.value)} placeholder="Novo usuário" style={IS}/></Fld>
              <Fld label="Nova senha"><input type="password" maxLength={100} value={f.np} onChange={e=>sf("np",e.target.value)} placeholder="Deixe em branco para não alterar" style={IS}/></Fld>
              {f.np&&<Fld label="Confirmar nova senha" span><input type="password" maxLength={100} value={f.cp} onChange={e=>sf("cp",e.target.value)} placeholder="Repita a nova senha" style={IS}/></Fld>}
            </div>
          </div>
          <FA onSave={save} onCancel={()=>{setOpen(false);setF({login:user.email||user.username,np:"",cp:"",cur:""});}} color="linear-gradient(135deg,#1d4ed8,#7c3aed)" label="Salvar credenciais" loading={saving}/>
        </div>
      </div>}
    </div>}
    {!isAdmin&&<div style={{background:"var(--card2)",borderRadius:14,padding:18,border:"1px solid var(--border)",fontSize:13,color:"var(--t3)",display:"flex",alignItems:"center",gap:10}}>
      <span style={{fontSize:20}}>🔒</span><span>A alteração de credenciais é exclusiva do administrador.</span>
    </div>}
  </div>;
}

// ─── RENDER ───────────────────────────────────────────────────────
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
